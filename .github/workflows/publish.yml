name: Validate, sign and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate dataset and build feed
        run: python3 scripts/build_site.py
      - name: Sign manifest
        env:
          POLICY_FEED_PRIVATE_KEY: ${{ secrets.POLICY_FEED_PRIVATE_KEY }}
        run: |
          test -n "$POLICY_FEED_PRIVATE_KEY"
          printf '%s\n' "$POLICY_FEED_PRIVATE_KEY" > "$RUNNER_TEMP/policy-feed-private.pem"
          openssl pkeyutl -sign -rawin \
            -inkey "$RUNNER_TEMP/policy-feed-private.pem" \
            -in site/manifest.json \
            -out "$RUNNER_TEMP/manifest.sig.bin"
          openssl base64 -A \
            -in "$RUNNER_TEMP/manifest.sig.bin" \
            -out site/manifest.sig
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
